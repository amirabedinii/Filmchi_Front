name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/*
      - bug-fix/*
  pull_request:
    branches:
      - main
      - feature/*
      - bug-fix/*

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --force

      - name: Lint
        run: npm run lint

      - name: Run unit/integration tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_USE_AUTH_MOCK: false

      - name: Archive standalone output
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone

      # - name: Build Docker image
      #   run: docker build -t ashpazyar-frontend:ci .
